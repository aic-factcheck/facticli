name: Build and deploy claim extractor API

on:
  push:
    branches: [main]
    paths:
      - "src/facticli/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "deploy/k8s/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The Rancher kubeconfig sets no default namespace, so kubectl would
  # otherwise operate on "default" and fail to find the deployment.
  NAMESPACE: ullrich-ns

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Runs only once the cluster credential is configured; the build above is
    # useful on its own, so a missing secret must not fail the workflow.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for cluster credentials
        id: creds
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG secret not set - image was published but not deployed."
          fi

      - name: Configure kubectl
        if: steps.creds.outputs.present == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret either base64-encoded or as raw YAML.
          if printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config" 2>/dev/null \
             && grep -q 'apiVersion' "$HOME/.kube/config"; then
            echo "kubeconfig: decoded from base64"
          else
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
            echo "kubeconfig: used verbatim"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl -n "$NAMESPACE" get deployment facticli-api -o name

      - name: Apply manifests and roll out
        if: steps.creds.outputs.present == 'true'
        run: |
          kubectl apply -f deploy/k8s/
          kubectl -n "$NAMESPACE" set image deployment/facticli-api \
            facticli-api="${{ needs.build.outputs.image }}:${{ github.sha }}"
          kubectl -n "$NAMESPACE" rollout status deployment/facticli-api --timeout=300s

      - name: Verify the public endpoint
        if: steps.creds.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS https://facticli.dyn.cloud.e-infra.cz/api/health || true)
            case "$body" in
              *'"status":"ok"'*)
                echo "$body"
                echo "$body" | grep -q '"auth_required":true' \
                  || { echo "::error::API is live but unauthenticated!"; exit 1; }
                echo "::notice::API healthy and gated."
                exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::Endpoint did not become healthy in time."
          exit 1
