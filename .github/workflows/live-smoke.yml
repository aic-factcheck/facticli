name: Live Smoke

# Manual only: one real `facticli check` against the OpenAI API, paid from the
# OPENAI_API_KEY repository secret. Start it from the Actions tab
# ("Run workflow"). Without the secret the test skips instead of failing.
on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_MODEL: gpt-5.6-terra
      FACTICLI_RUN_LIVE_SMOKE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      - name: Run live smoke test
        run: python -m unittest tests.test_live_smoke -v
