name: Deploy claim extractor demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "src/facticli/web/static/cedmo_mark.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp src/facticli/web/static/cedmo_mark.svg _site/cedmo_mark.svg
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
