name: Deploy claim extractor demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "src/facticli/web/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp pages/index.html pages/app.js _site/
          cp src/facticli/web/static/styles.css src/facticli/web/static/cedmo_logo.svg _site/

      - name: Write backend configuration
        env:
          DEMO_API_BASE: ${{ vars.DEMO_API_BASE }}
        run: |
          printf 'window.FACTICLI_CONFIG = { apiBase: "%s" };\n' "${DEMO_API_BASE}" > _site/config.js
          cat _site/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
